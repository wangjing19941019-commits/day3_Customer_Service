[tool.ruff]
target-version = "py311"
src = ["backend/src", "backend/tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "backend"
files = ["backend/src", "backend/tests"]
exclude = ["pycore"]

[[tool.mypy.overrides]]
module = "pycore.*"
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
timeout = 120
addopts = "--timeout=120"
