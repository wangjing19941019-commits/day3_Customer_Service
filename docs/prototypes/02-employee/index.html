<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>员工端 · 智能客服</title>
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <strong>智能客服</strong>
        <span class="page-name">员工端</span>
      </div>
    </header>
    <div class="shell">
      <nav class="sidebar" aria-label="页面">
        <a data-page="employee" class="active" href="../02-employee/index.html">员工端</a>
        <a data-page="agent" href="../03-agent/index.html">客服端</a>
        <a data-page="knowledge" href="../04-knowledge/index.html">知识库</a>
      </nav>
      <main class="main">
        <div class="status-bar">
          <span id="status-text">AI 接待中</span>
          <button class="btn btn-secondary" type="button" id="transfer">转人工</button>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <textarea id="ask" rows="2" placeholder="输入问题"></textarea>
          <button class="btn btn-primary" type="submit">发送</button>
        </form>
      </main>
    </div>
  </div>
  <script src="../shared/app.js"></script>
  <script>initEmployee();</script>
</body>
</html>
